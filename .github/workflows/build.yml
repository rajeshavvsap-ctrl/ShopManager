name: Build APK
on:
  push:
    branches-ignore: [shopmanager-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShopManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to shopmanager-apk branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/ShopManager.apk
          cd /tmp/out
          git init -q -b shopmanager-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ShopManager.apk
          git commit -q -m "APK from ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shopmanager-apk
